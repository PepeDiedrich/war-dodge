# "termux" uses the Android location permission through Termux:API. If it is
# unavailable, the app falls back to IP country lookup. IP is less accurate,
# particularly behind a VPN or mobile carrier gateway.
location_provider = termux
interval = 1h
retry_min = 30s
retry_max = 15m
# A reliable externally reachable host:port. Change this if needed.
health_host = 1.1.1.1:53
connect_timeout = 8s

# Runs only when the saved phase changes. The command receives WAR_DODGER_TITLE
# and WAR_DODGER_MESSAGE as environment variables. Termux provides this command
# through the Termux:API app and its package.
notify_command = termux-notification --title "$WAR_DODGER_TITLE" --content "$WAR_DODGER_MESSAGE"
# Leave false to establish the initial baseline silently.
notify_on_initial = false
